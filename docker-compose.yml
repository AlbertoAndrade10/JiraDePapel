services:
  postgres:
    image: postgres:16
    container_name: postgres-jirapapel
    restart: unless-stopped
    environment:
      POSTGRES_DB: jira
      POSTGRES_USER: useruser
      POSTGRES_PASSWORD: userpass
    ports:
      - "5432:5432"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U useruser"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-auth-data: